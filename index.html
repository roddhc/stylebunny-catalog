<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StyleBunny 🐇</title>
<meta name="description" content="StyleBunny — your personal closet, lookbook studio and style journal. No account needed.">
<style>
  :root { --deep:#8B3A5A; --ink:#2B2B2B; --soft:#FFF7F9; --muted:#6B6B6B; }
  @media (prefers-color-scheme: dark) { :root { --ink:#F2F2F2; --soft:#1B1517; --muted:#B9B9B9; } }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--soft);
         color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { max-width:420px; text-align:center; }
  .bunny { font-size:64px; }
  p { color:var(--muted); line-height:1.5; }
  a.btn { display:block; padding:16px; border-radius:16px; background:var(--deep); color:#fff; font-weight:800;
          text-decoration:none; margin:24px 0 12px; }
  .small a { color:var(--muted); }
</style>
</head>
<body>
  <main>
    <div class="bunny">🐇</div>
    <h1>StyleBunny</h1>
    <p>Your personal closet, lookbook studio and style journal. No account needed — your style data stays on your phone.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.stylebunny.shop_fashion_and_lifestyle">Get it on Google Play</a>
    <p class="small"><a href="https://sites.google.com/view/cosmictags/privacy-policies/stylebunny-privacy">Privacy Policy</a></p>
  </main>
</body>
</html>
